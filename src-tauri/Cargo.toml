[package]
name = "talkist"
version = "0.1.3"
description = "Local-only push-to-talk dictation"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
sherpa-onnx = "1.13"
cpal = "0.15"
arboard = "3"
enigo = "0.6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ureq = "2"
sha2 = "0.10"
semver = "1"
minisign-verify = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[[bin]]
name = "asr-check"
path = "src/bin/asr-check.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
