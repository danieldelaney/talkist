name: Talkist
options:
  bundleIdPrefix: com.talkist
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
packages:
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 1.13.8
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: true
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_IDENTITY: "Developer ID Application: Daniel Delaney (367XU828P7)"
    DEVELOPMENT_TEAM: 367XU828P7
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: false
targets:
  Talkist:
    type: application
    platform: macOS
    sources:
      - Talkist
    dependencies:
      - package: SherpaOnnx
        product: sherpa-onnx
        embed: false
    info:
      path: Talkist/Info.plist
      properties:
        CFBundleName: Talkist
        CFBundleDisplayName: Talkist
        CFBundleIdentifier: com.talkist.app
        CFBundleShortVersionString: "0.1.4"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        NSMicrophoneUsageDescription: Talkist needs microphone access to transcribe your speech.
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
    entitlements:
      path: Talkist/Talkist.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.cs.allow-jit: true
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_NAME: Talkist
        PRODUCT_BUNDLE_IDENTIFIER: com.talkist.app
        MARKETING_VERSION: "0.1.4"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_ENTITLEMENTS: Talkist/Talkist.entitlements
        INFOPLIST_KEY_LSUIElement: true
    postBuildScripts:
      - name: Fix embedded package frameworks
        script: |
          # The onnxruntime-libs xcframework ships Versions/Current as a real
          # directory (plus a root Resources dir) instead of the standard
          # symlinks, which makes the embedded stub frameworks unsignable and
          # fails the final app codesign. Nothing loads them at runtime
          # (everything is statically linked), but the bundle must be
          # internally consistent for the app to sign.
          FWDIR="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Frameworks"
          [ -d "$FWDIR" ] || exit 0
          for fw in "$FWDIR"/*.framework; do
            name="$(basename "$fw" .framework)"
            if [ -d "$fw/Versions/Current" ] && [ -d "$fw/Versions/A" ]; then
              rm -rf "$fw/Versions/Current"
              ln -s A "$fw/Versions/Current"
            fi
            if [ -d "$fw/Resources" ]; then
              rm -rf "$fw/Resources"
              ln -s Versions/Current/Resources "$fw/Resources"
            fi
            identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
            codesign --force --sign "$identity" --options runtime "$fw/Versions/A/$name" >/dev/null 2>&1 || true
            codesign --force --sign "$identity" --options runtime "$fw" >/dev/null 2>&1 || true
          done
